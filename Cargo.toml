[package]
name = "vvcm-rs"
version = "2.0.0"
edition = "2024"
description = "Kinematics of multi-robot transporting systems with a deformable sheet using VVCM."
authors = ["MorningFrog <1098224028@qq.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/MorningFrog/vvcm-rs"
homepage = "https://github.com/MorningFrog/vvcm-rs"
documentation = "https://docs.rs/vvcm-rs"
keywords = ["kinematics", "robotics", "vvcm", "deformable-sheet"]
categories = ["algorithms", "science", "simulation"]

[lib]
name = "vvcm_rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
python-extension = ["dep:numpy", "dep:pyo3", "pyo3/extension-module"]
wasm = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
nalgebra = "0.35.0"
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.0", optional = true }
thiserror = "2.0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.100", optional = true }
wasm-bindgen = { version = "0.2.123", optional = true }

[dev-dependencies]
cc = "1.2.63"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.73"
